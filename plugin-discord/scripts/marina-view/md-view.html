<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  __BASE__
  <title>__TITLE__</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #1f2328; --mute: #59636e; --line: #d1d9e0; --code: #f6f8fa; --accent: #0969da; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --fg: #e6e8eb; --mute: #9aa4af; --line: #2a2f38; --code: #181b21; --accent: #6ea8fe; } }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    #md { max-width: 820px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); overflow-wrap: anywhere; }
    h1, h2, h3, h4 { line-height: 1.3; margin: 1.5em 0 .6em; }
    h1 { font-size: 1.6em; padding-bottom: .3em; border-bottom: 1px solid var(--line); }
    h2 { font-size: 1.3em; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
    h3 { font-size: 1.12em; }
    p, ul, ol, blockquote, pre, table, .tbl { margin: 0 0 1em; }
    a { color: var(--accent); }
    code { font: .88em ui-monospace, Menlo, monospace; background: var(--code); padding: .15em .35em; border-radius: 5px; }
    pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; }
    pre code { background: none; padding: 0; font-size: .85em; white-space: pre; }
    blockquote { margin-left: 0; padding: 0 1em; color: var(--mute); border-left: 4px solid var(--line); }
    img, svg { max-width: 100%; height: auto; }
    hr { border: 0; border-top: 1px solid var(--line); }
    .tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { border-collapse: collapse; width: max-content; min-width: 100%; }
    th, td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; vertical-align: top; }
    th { background: var(--code); }
    .mermaid { text-align: center; overflow-x: auto; margin: 0 0 1em; }
    .md-err { color: #cf222e; font-size: .9em; }
  </style>
</head>
<body>
  <main id="md"></main>
  <script type="application/json" id="md-data">__DATA__</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
  <script src="/v-md/md-view.js"></script>
</body>
</html>
